name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned requirements and the package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run the tests
        run: python -m pytest -q -o addopts="" -rs
      - name: Execute the notebook (the OptionMetrics section skips without the licensed files)
        if: success() || failure()
        run: python -m jupyter nbconvert --to notebook --execute --inplace notebooks/analysis.ipynb
